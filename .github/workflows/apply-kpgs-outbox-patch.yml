name: Apply KPGS Outbox Patch

on:
  push:
    branches:
      - "agent/kpgs-durable-outbox"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crisisconnect-kpgs-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.event_name != 'push' || github.event.head_commit.message != 'feat(kpgs): integrate durable outbox into adaptive PWA'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/kpgs-durable-outbox

      - name: Apply deterministic integration patch
        run: python scripts/apply_kpgs_outbox_patch.py

      - name: Syntax-check patched JavaScript
        run: |
          node --check kpgs-outbox.js
          node --check app.js
          node --check sw.js

      - name: Commit patched runtime
        shell: bash
        run: |
          if git diff --quiet -- app.js index.html; then
            echo "Runtime already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "feat(kpgs): integrate durable outbox into adaptive PWA"
          git push origin HEAD:agent/kpgs-durable-outbox
